<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Boas-vindas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    input, button {
      padding: 8px;
      font-size: 16px;
    }

    #mensagem {
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <h1>Digite seu nome</h1>

  <form id="form-nome">
    <input type="text" id="nome" placeholder="Seu nome" required />
    <button type="submit">Enviar</button>
  </form>

  <p id="mensagem"></p>

  <script src="script.js"></script>
</body>
</html>
